<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Markdown Viewer & Editor - DevTools</title>
  <meta name="description" content="Fast, private client-side Markdown viewer, live editor, and HTML previewer with table, task list, and code formatting support.">
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon_io/favicon-16x16.png">
  <link rel="shortcut icon" href="../favicon_io/favicon.ico">
  <link rel="stylesheet" href="../style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../components.js"></script>
  <style>
    .markdown-workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      min-height: 580px;
    }
    @media (max-width: 820px) {
      .markdown-workspace { grid-template-columns: 1fr; }
    }
    .markdown-preview {
      padding: 1.25rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow-y: auto;
      max-height: 650px;
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--text-primary);
    }
    .markdown-preview h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; margin-top: 0; }
    .markdown-preview h2 { font-size: 1.3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3rem; margin-top: 1.2rem; }
    .markdown-preview h3 { font-size: 1.1rem; margin-top: 1rem; }
    .markdown-preview p { margin: 0.6rem 0; }
    .markdown-preview code { font-family: var(--font-mono); background: rgba(128,128,128,0.15); padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
    .markdown-preview pre { background: var(--bg-primary); padding: 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); overflow-x: auto; margin: 0.85rem 0; }
    .markdown-preview pre code { background: none; padding: 0; }
    .markdown-preview blockquote { border-left: 3px solid var(--text-primary); margin: 0.85rem 0; padding-left: 0.85rem; color: var(--text-secondary); }
    .markdown-preview table { width: 100%; border-collapse: collapse; margin: 0.85rem 0; font-size: 0.85rem; }
    .markdown-preview th, .markdown-preview td { border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; text-align: left; }
    .markdown-preview th { background: rgba(128,128,128,0.1); font-weight: 600; }
    .markdown-preview ul, .markdown-preview ol { padding-left: 1.5rem; margin: 0.6rem 0; }
    .markdown-preview li { margin: 0.25rem 0; }
    .markdown-preview hr { border: none; border-top: 1px solid var(--border-color); margin: 1.25rem 0; }
    .stat-badge { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-secondary); }
  </style>
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="main-content">
    <div class="container">
      <div class="tool-page-header">
        <a href="../index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to all tools</a>
        <div class="tool-page-title-row">
          <h1 class="tool-page-title">Markdown Viewer & Editor</h1>
          <span class="tool-badge" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3);">Markdown</span>
        </div>
        <p class="tool-page-desc">Write or paste Markdown and see the formatted HTML preview live in real time. Supports GitHub Flavored Markdown, tables, checklists, and code formatting.</p>
      </div>

      <div class="tool-options-bar" style="margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem;">
        <button id="btn-copy-md" class="btn-sm"><i data-lucide="copy"></i> Copy Markdown</button>
        <button id="btn-copy-html" class="btn-sm btn-primary"><i data-lucide="code"></i> Copy HTML</button>
        <button id="btn-download-md" class="btn-sm"><i data-lucide="download"></i> Download .md</button>
        <button id="btn-download-html" class="btn-sm"><i data-lucide="download"></i> Download .html</button>
        <button id="btn-clear" class="btn-sm" style="margin-left: auto;"><i data-lucide="trash-2"></i> Clear</button>
      </div>

      <div class="markdown-workspace">
        <div class="tool-panel">
          <div class="panel-header">
            <span class="panel-title"><i data-lucide="edit-3"></i> Markdown Input</span>
            <div style="display: flex; gap: 0.5rem;">
              <input type="file" id="file-input" accept=".md,.txt" style="display: none;">
              <button id="btn-upload" class="btn-sm"><i data-lucide="upload"></i> Open File</button>
            </div>
          </div>
          <textarea id="md-input" class="tool-textarea" style="height: 550px; font-family: var(--font-mono); font-size: 0.85rem;" placeholder="Type or paste Markdown here..."></textarea>
          <div class="panel-footer" style="margin-top: 0.5rem;">
            <span id="md-stats" class="stat-badge">0 words | 0 chars | 0 min read</span>
          </div>
        </div>

        <div class="tool-panel">
          <div class="panel-header">
            <span class="panel-title"><i data-lucide="eye"></i> HTML Live Preview</span>
          </div>
          <div id="md-preview" class="markdown-preview" style="height: 550px;"></div>
          <div class="panel-footer" style="margin-top: 0.5rem;">
            <span class="stat-badge">Rendered Client-Side</span>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="common.js"></script>
  <script>
    const mdInput = document.getElementById('md-input');
    const mdPreview = document.getElementById('md-preview');
    const mdStats = document.getElementById('md-stats');

    function parseMarkdown(md) {
      if (!md) return '<p style="color:var(--text-muted);font-style:italic;">Preview will appear here...</p>';
      if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
        try {
          return marked.parse(md, { breaks: true, gfm: true });
        } catch (e) {
          console.warn('Marked parse error, falling back:', e);
        }
      }
      
      let html = md
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        // Fenced code blocks
        .replace(/```([a-z0-9_-]*)\n([\s\S]*?)```/g, (m, lang, code) => `<pre><code class="language-${lang}">${code}</code></pre>`)
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Headings
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Blockquotes
        .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
        // Horizontal rules
        .replace(/^---$/gim, '<hr>')
        // Bold & Italic
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/__(.*?)__/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/_(.*?)_/g, '<em>$1</em>')
        .replace(/~~(.*?)~~/g, '<del>$1</del>')
        // Links & Images
        .replace(/!\[([^\]]+)\]\(([^\)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:6px;margin:0.5rem 0;">')
        .replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent-color);">$1</a>')
        // Checkboxes
        .replace(/^- \[x\] (.*$)/gim, '<div style="display:flex;gap:0.4rem;align-items:center;"><input type="checkbox" checked disabled> <span>$1</span></div>')
        .replace(/^- \[ \] (.*$)/gim, '<div style="display:flex;gap:0.4rem;align-items:center;"><input type="checkbox" disabled> <span>$1</span></div>')
        // Unordered lists
        .replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>')
        // Line breaks & paragraphs
        .replace(/\n\n+/g, '</p><p>');

      // Wrap list items
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
      return `<p>${html}</p>`;
    }

    function update() {
      const val = mdInput.value;
      mdPreview.innerHTML = parseMarkdown(val);
      
      const words = val.trim() ? val.trim().split(/\s+/).length : 0;
      const chars = val.length;
      const readTime = Math.ceil(words / 200);
      mdStats.textContent = `${words.toLocaleString()} words | ${chars.toLocaleString()} chars | ~${readTime} min read`;
    }

    mdInput.addEventListener('input', update);

    document.getElementById('btn-clear').addEventListener('click', () => {
      mdInput.value = '';
      update();
      mdInput.focus();
    });

    document.getElementById('btn-copy-md').addEventListener('click', () => copyToClipboard(mdInput.value, 'Markdown'));
    document.getElementById('btn-copy-html').addEventListener('click', () => copyToClipboard(mdPreview.innerHTML, 'Rendered HTML'));
    document.getElementById('btn-download-md').addEventListener('click', () => downloadTextFile('document.md', mdInput.value, 'text/markdown'));
    document.getElementById('btn-download-html').addEventListener('click', () => downloadTextFile('document.html', `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Document</title><style>body{font-family:sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem;line-height:1.6;}</style></head><body>${mdPreview.innerHTML}</body></html>`, 'text/html'));

    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-upload').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => { mdInput.value = r.result; update(); };
      r.readAsText(file);
    });

    // Initial render
    update();
  </script>
</body>
</html>
